[package]
name = "fish-audio-studio"
version = "0.1.0"
description = "Fish Audio Voiceover Studio with Model IDs and Inline Emotion Tags"
license = "MIT"

[dependencies]
"wasmer/static-web-server" = "^1"

[[command]]
name = "script"
module = "wasmer/static-web-server:webserver"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["/dist"]
